# Runs the live loop, the paper loop, the dashboard, the market-data recorder
# and the learner on a server. See deploy/README.md for the walk-through.
#
#   cp deploy/.env.server .env      # then fill in the key id and a dashboard password
#   mkdir -p secrets && cp /path/to/key.txt secrets/kalshi-key.txt
#   docker compose -f deploy/docker-compose.yml up -d
#
# Watch:   docker compose -f deploy/docker-compose.yml logs -f live
# Stop:    docker compose -f deploy/docker-compose.yml stop live
#          (or touch state/STOP; the loop exits and the container stays down)
# Dashboard: published on DASHBOARD_BIND (default localhost only). With
# Tailscale, set DASHBOARD_BIND to the server's Tailscale IP so only your own
# devices can reach it; DASHBOARD_PASSWORD is required either way.

services:
  live:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kalshi-bot
    env_file: ../.env
    environment:
      KALSHI_PRIVATE_KEY_PATH: /secrets/kalshi-key.txt
    volumes:
      - ../state:/app/state
      - ../secrets:/secrets:ro
    command: >
      --env prod live-trade --strategy ${STRATEGY:-fairvalue} --margin ${MARGIN:-0.03}
      --dollars ${TRADE_DOLLARS:-10} --loss-cap ${LOSS_CAP:-50}
      --profit-target ${PROFIT_TARGET:-0} --real-money --yes
    restart: unless-stopped

  # the same strategy on production quotes with simulated fills: its results
  # count toward the confidence tiers that gate sizing, at no cost
  paper:
    image: kalshi-bot
    env_file: ../.env
    environment:
      KALSHI_PRIVATE_KEY_PATH: /secrets/kalshi-key.txt
    volumes:
      - ../state:/app/state
      - ../secrets:/secrets:ro
    command: >
      --env prod paper-trade --strategy ${STRATEGY:-fairvalue} --margin ${MARGIN:-0.03}
      --dollars ${TRADE_DOLLARS:-10} --loss-cap 1000 --profit-target 0
    restart: unless-stopped

  dashboard:
    image: kalshi-bot
    env_file: ../.env
    volumes:
      - ../state:/app/state
    command: demo-ui --host 0.0.0.0 --port 8765
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:8765:8765"
    restart: unless-stopped

  recorder:
    image: kalshi-bot
    volumes:
      - ../state:/app/state
    command: record
    restart: unless-stopped

  # the self-improvement loop: retrains hourly on the recorder's data, promotes
  # parameters only past the gate, and lowers size or halts on live drift
  learn:
    image: kalshi-bot
    volumes:
      - ../state:/app/state
    command: learn --every 3600
    restart: unless-stopped
