[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Automated trading bot for Kalshi 15-minute crypto markets"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "websockets>=13",
]

[project.optional-dependencies]
research = [
    "pandas>=2.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pandas>=2.0",
]

[project.scripts]
kalshi-bot = "kalshi_bot.cli:main"

[tool.setuptools.packages.find]
include = ["kalshi_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
